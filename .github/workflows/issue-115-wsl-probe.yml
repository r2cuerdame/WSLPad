name: Issue 115 isolated WSL feasibility

on:
  push:
    branches: [issue/115]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check isolated runner WSL2 and test distro
        shell: pwsh
        run: |
          wsl.exe --status
          if ($LASTEXITCODE -ne 0) { throw "WSL status failed: $LASTEXITCODE" }
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw "Test distro install failed: $LASTEXITCODE" }
          wsl.exe --distribution Ubuntu-24.04 --exec /bin/uname -a
          if ($LASTEXITCODE -ne 0) { throw "Test distro launch failed: $LASTEXITCODE" }
