name: Public release lifecycle smoke

on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Previously supported version to upgrade from
        required: true
        default: 1.1.1
      target_version:
        description: Public release version under verification
        required: true
        default: 1.1.2
      target_sha256:
        description: Expected SHA-256 for the public target installer
        required: false
        default: ''
      runner:
        description: Runner environment (self-hosted or windows-latest)
        required: false
        default: windows-latest
        type: choice
        options:
          - windows-latest
          - self-hosted
      require_no_distros:
        description: Enforce zero registered WSL distros precondition
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release-lifecycle-smoke.yml
      - scripts/release-lifecycle-smoke.ps1

permissions:
  contents: read

jobs:
  lifecycle:
    name: Install, launch, update, uninstall, and reinstall
    runs-on: ${{ inputs.runner || (vars.RUNS_ON || 'windows-latest') }}
    timeout-minutes: 20

    steps:
      - name: Check out lifecycle script
        uses: actions/checkout@v7

      - name: Confirm associations are not applicable
        shell: pwsh
        run: |
          $configured = Select-String -Path electron-builder.yml -Pattern '^\s*(protocols|fileAssociations):'
          if ($configured) { throw 'Lifecycle coverage must be extended for configured protocols/file associations.' }
          'No protocols or file associations are configured; this acceptance item is not applicable.'

      - name: Exercise public installer lifecycle
        shell: pwsh
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version || (github.event_name == 'pull_request' && '1.1.0' || '1.1.1') }}
          TARGET_VERSION: ${{ inputs.target_version || (github.event_name == 'pull_request' && '1.1.1' || '1.1.2') }}
          TARGET_SHA256: ${{ inputs.target_sha256 || (github.event_name == 'pull_request' && 'AA6CA9FAB141FF459D7C9ADEA6AEA78728536BCF760ED68E3FD95DECAB522845' || '') }}
        run: |
          $params = @{
            PreviousVersion = $env:PREVIOUS_VERSION
            TargetVersion   = $env:TARGET_VERSION
          }
          if ($env:TARGET_SHA256) {
            $params['TargetSha256'] = $env:TARGET_SHA256
          }
          if ('${{ inputs.require_no_distros }}' -eq 'true' -or ('${{ inputs.runner }}' -ne 'self-hosted')) {
            $params['RequireNoDistros'] = $true
          }
          ./scripts/release-lifecycle-smoke.ps1 @params
