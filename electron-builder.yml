appId: io.purpleship.wslpad
productName: WSLPad
copyright: Copyright © 2026 r2cuerdame
directories:
  buildResources: resources
  output: release
# out/ carries bundled main/preload/renderer; production node_modules are
# packed automatically (main externalizes its deps: node-pty, mcp sdk, …)
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - '!icon-*.png'
asarUnpack:
  - node_modules/node-pty/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WSLPad
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # Localized installer/uninstaller strings for the 9 supported UI languages
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - ko_KR
    - ja_JP
    - zh_CN
    - zh_TW
    - es_ES
    - fr_FR
    - de_DE
    - pt_BR
publish:
  provider: github
  owner: r2cuerdame
  repo: WSLPad
# node-pty 1.1.0 ships N-API prebuilds for win32-x64 — no electron rebuild needed
npmRebuild: false
# Use the locally verified Electron binaries (flaky network corrupts the
# builder's own multi-part download of the same zip)
electronDist: node_modules/electron/dist
